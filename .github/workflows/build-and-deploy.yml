name: Scheduled Rebuild

on:
  schedule:
    - cron: '17 4 * * *' # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  models: read
  pages: write
  id-token: write

env:
  # Runner forces Node 24 for JS actions from 2026-06-16; opt in now so the
  # switch can't break an unattended nightly rebuild.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore Summary cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: summaries-${{ github.run_id }}
          restore-keys: |
            summaries-

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Seam 4 — post-deploy smoke check. Runs after deploy; never blocks it.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the live site and assert it serves the expected page
        run: |
          status=$(curl -s -o page.html -w '%{http_code}' https://jakhmola.github.io)
          test "$status" = "200"
          grep -q 'Shubham Jakhmola' page.html
          # Content must be in the HTML, not painted by the bundle: ADR 0001
          # applies to the front end too.
          grep -q 'id="field"' page.html
          grep -q 'class="beat work"' page.html
